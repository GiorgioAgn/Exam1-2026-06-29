{% extends 'base.html' %}
{% block title %}Accedi | NatureS{% endblock %}

{% block content %}
<main class="container-fluid px-3 px-lg-5 py-5 d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="card border-0 shadow-sm rounded-4 p-5" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <h2 class="homepage-title">Bentornato</h2>
        </div>
        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <input type="email" name="email" class="form-control rounded-pill bg-light border-0 px-4 py-2" placeholder="Email" required>
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control rounded-pill bg-light border-0 px-4 py-2" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-bold">Accedi</button>
        </form>
        <p class="text-center mt-4 mb-0 text-muted small">Non hai un account? <a href="{{ url_for('register') }}" class="text-dark fw-bold">Registrati</a></p>
    </div>
</main>
{% endblock %}
